name: Uninstall
description: Uninstall.io was a mobile "uninstall intelligence" platform built by Songline
  Analytics (Bengaluru/Singapore, founded 2015) whose iOS and Android SDKs tracked app
  uninstalls, surfaced uninstall reasons, and drove re-install campaigns for customers like
  Snapdeal, Axis Bank, Zalora, and BankBazaar. Backed by 500 Startups India, Rajan Anandan,
  and Hive Data, it was acquired by Singapore healthtech company Mobile Health in July 2018.
  The uninstall.io domain is now parked for sale and no public API surface remains; the
  GitHub organization and first-party mobile SDKs survive as the public footprint.
